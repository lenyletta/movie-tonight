{"id": 6553389, "title": "Новая волна", "original": "Nouvelle Vague", "year": 2025, "poster": "posters/6553389.jpg", "runtime": 105, "countries": ["Франция", "США"], "genres": ["драма", "комедия", "биографический"], "age": "18+", "rating": 7.6, "logline": "Молодой Жан-Люк Годар снимает свой первый полнометражный фильм и проверяет на практике, какие правила кино можно нарушить.", "synopsis": "Париж, конец пятидесятых. Кинокритик Жан-Люк Годар собирается перейти от разговоров о кино к собственному полнометражному дебюту. Его друзья уже снимают, а он намерен доказать, что фильм можно создать по другим правилам: быстрее, свободнее и прямо на городских улицах. Для будущей картины «На последнем дыхании» сходятся американская актриса Джин Сиберг, начинающий Жан-Поль Бельмондо и небольшая команда, которой приходится привыкать к неожиданным решениям режиссёра. Подготовка постоянно перетекает в импровизацию, рабочие споры — в беседы об искусстве, а повседневный Париж становится съёмочной площадкой. История следит за людьми, ещё не знающими, какое место их работа займёт в истории кинематографа. На первом плане здесь удовольствие от совместного поиска, молодая самоуверенность и непростой процесс превращения дерзкой идеи в реальный фильм.", "mood": "Лёгкое, увлечённое и ироничное; за игровым тоном чувствуется тревога дебюта.", "themes": ["свобода творчества", "кинематограф и его история", "дружба и сотрудничество", "молодость и амбиции"], "visual": "Чёрно-белое изображение и почти квадратный кадр воспроизводят зрительское ощущение французского кино рубежа пятидесятых и шестидесятых; улицы и разговоры важнее зрелищных декораций.", "directors": ["Ричард Линклейтер"], "cast": ["Гийом Марбек", "Зои Дойч", "Обри Дюллен", "Адриен Руйяр", "Антуан Бессон"]}, {"id": 1040690, "title": "Середина 90-х", "original": "Mid90s", "year": 2018, "poster": "posters/1040690.jpg", "runtime": 85, "countries": ["США"], "genres": ["драма", "комедия"], "age": "18+", "rating": 7.4, "logline": "Подросток из Лос-Анджелеса находит компанию скейтбордистов и пытается понять, сколько стоит принадлежность к новой семье.", "synopsis": "Лос-Анджелес середины девяностых. Тринадцатилетний Стиви живёт с матерью и старшим братом, отношения с которым давно стали источником постоянного напряжения. Однажды он замечает компанию ребят у скейтшопа и начинает возвращаться туда снова и снова. Скейтборд пока плохо ему подчиняется, зато рядом появляется мир, где можно получить прозвище, заслужить уважение и провести целый день вне дома. Старшие друзья знакомят его с музыкой, городскими маршрутами и негласными правилами своей компании. Желание стать своим заставляет Стиви соглашаться на вещи, к которым он ещё не готов. Фильм наблюдает за обычными разговорами, первыми успехами и болезненными попытками произвести впечатление. За свободой уличного лета постепенно проступают разные представления о дружбе, заботе и взрослении.", "mood": "Тёплое и ностальгическое, временами неловкое и болезненное; без идеализации подростковой среды.", "themes": ["взросление", "найденная семья", "скейт-культура", "потребность в принятии"], "visual": "Зернистое изображение Super 16 и формат 4:3 сближают фильм с домашними записями и скейт-видео; камера держится рядом с героями.", "directors": ["Джона Хилл"], "cast": ["Санни Сулджик", "Кэтрин Уотерстон", "Лукас Хеджес", "На-Кел Смит", "Олан Пренатт"]}, {"id": 714248, "title": "Песнь моря", "original": "Song of the Sea", "year": 2014, "poster": "posters/714248.jpg", "runtime": 93, "countries": ["Ирландия", "Дания", "Бельгия", "Франция", "Люксембург"], "genres": ["анимация", "фэнтези", "приключения", "семейный", "драма"], "age": "6+", "rating": 8.2, "logline": "Брат и сестра отправляются через мир ирландских преданий, чтобы найти дорогу домой и услышать голос, связывающий людей с морем.", "synopsis": "Бен живёт с отцом и младшей сестрой Сиршей у моря, рядом с маяком. После исчезновения матери семья словно разучилась говорить о самом важном, а девочка вообще не произносит слов. Бен раздражается на сестру и держится за собственные воспоминания о маминых историях. Когда бабушка решает увезти детей в город, привычный берег остаётся далеко, но старые легенды неожиданно оказываются совсем рядом. Сирша связана с существами, о которых рассказывала мать, и её голос может иметь для них особое значение. Брату и сестре предстоит пройти незнакомыми дорогами, встретить удивительных обитателей скрытого мира и научиться полагаться друг на друга. Путешествие соединяет семейную историю с ирландскими сказаниями, постепенно превращая детские страхи и обиды в понятный каждому разговор о памяти, заботе и утрате.", "mood": "Нежное, меланхоличное и волшебное; тревога уравновешена теплом и юмором.", "themes": ["семья и утрата", "сила голоса", "ирландский фольклор", "сочувствие"], "visual": "Рисованная двухмерная анимация с орнаментальными контурами, округлыми формами и акварельными фонами; море и пейзаж организованы как декоративные композиции.", "directors": ["Томм Мур"], "cast": ["Дэвид Роул", "Люси О’Коннелл", "Брендан Глисон", "Фионнула Флэнаган", "Лиза Ханниган"]}, {"id": 425, "title": "Седьмая печать", "original": "Det sjunde inseglet", "year": 1957, "poster": "posters/425.jpg", "runtime": 96, "countries": ["Швеция"], "genres": ["драма", "фэнтези"], "age": "18+", "rating": 8.0, "logline": "Вернувшийся из крестового похода рыцарь предлагает Смерти шахматную партию и отправляется через страну, охваченную чумой.", "synopsis": "Рыцарь Антониус Блок возвращается из крестового похода вместе с оруженосцем Йёнсом. На родине их встречают чума, страх и люди, пытающиеся объяснить происходящее волей небес. На пустынном берегу Блок сталкивается со Смертью и предлагает ей сыграть в шахматы, надеясь выиграть время. Продолжая путь, он ищет ответ на вопрос, который не дают ни вера, ни пережитый опыт: можно ли узнать, есть ли смысл за пределами человеческого существования. Дорога сводит путешественников с бродячими артистами, крестьянами и служителями религиозных обрядов. У каждого свой способ выдержать неизвестность — насмешка, любовь, труд или молитва. История соединяет философский спор с земными заботами людей, которым всё ещё нужно делить еду, растить детей и помогать друг другу среди всеобщей тревоги.", "mood": "Суровое и тревожное, с неожиданным бытовым юмором и островками нежности.", "themes": ["смерть и конечность", "вера и сомнение", "сострадание", "искусство и повседневность"], "visual": "Контрастное чёрно-белое изображение, строгие групповые композиции и пейзажи; театральная условность встречается с материальностью лиц и природных фактур.", "directors": ["Ингмар Бергман"], "cast": ["Макс фон Сюдов", "Гуннар Бьёрнстранд", "Бенгт Экерут", "Нильс Поппе", "Биби Андерссон"]}, {"id": 425400, "title": "Пожары", "original": "Incendies", "year": 2010, "poster": "posters/425400.jpg", "runtime": 131, "countries": ["Канада", "Франция"], "genres": ["драма", "детектив", "военный"], "age": "18+", "rating": 8.1, "logline": "Завещание матери отправляет канадских близнецов на Ближний Восток, где им предстоит заново узнать историю своей семьи.", "synopsis": "После смерти матери близнецы Жанна и Симон приходят к нотариусу и получают необычное завещание. Им оставлены два письма, которые нужно передать людям, само существование которых ставит под сомнение привычную семейную историю. Жанна решает разобраться в прошлом Наваль и отправляется на Ближний Восток; Симону гораздо труднее принять материнскую просьбу. Поиски ведут от официальных свидетельств к чужим воспоминаниям, от сегодняшней жизни к следам давнего вооружённого конфликта. Параллельно фильм показывает молодую Наваль в стране, где частная судьба всё сильнее зависит от политического и религиозного противостояния. Близнецам приходится учиться слушать людей, для которых прошлое по-прежнему остаётся болезненным настоящим. Семейное расследование постепенно превращается в попытку понять молчание матери, силу её обещаний и цену сохранённой памяти.", "mood": "Напряжённое, скорбное и сосредоточенное; эмоциональная сила нарастает без облегчительных объяснений.", "themes": ["семейная память", "последствия войны", "молчание и свидетельство", "поиск происхождения"], "visual": "Сдержанная камера, выжженные пейзажи и контраст канадского настоящего с ближневосточным прошлым; монтаж соединяет два времени через поиск свидетельств.", "directors": ["Дени Вильнёв"], "cast": ["Лубна Азабаль", "Мелисса Дезормо-Пулен", "Максим Годетт", "Реми Жирар", "Аллен Олтмен"]}, {"id": 5237750, "title": "Не хороните меня без Ивана", "original": "Кэрэни көрбүт", "year": 2022, "poster": "posters/5237750.jpg", "runtime": 124, "countries": ["Россия"], "genres": ["драма", "комедия", "исторический"], "age": "12+", "rating": 8.0, "logline": "Якутский крестьянин, страдающий приступами летаргического сна, следует за художником в экспедицию, чтобы однажды не оказаться похороненным заживо.", "synopsis": "Якутия, 1910 год. Степан Бересеков живёт среди людей, которым трудно понять его необычное состояние: время от времени он впадает в сон, почти неотличимый от смерти. Художник и исследователь Иван Попов умеет распознавать эти приступы и становится для Степана человеком, которому можно доверить собственную жизнь. Но Ивану предстоит долгая этнографическая экспедиция. Не желая оставаться без своего защитника, Степан решает отправиться вслед за ним. Дорога ведёт путешественников через селения и открытые просторы, знакомит с разными людьми, обычаями и историями. Пока Иван собирает предметы и свидетельства местной культуры, его спутник по-своему воспринимает красоту окружающего мира. Их совместный путь соединяет бытовые трудности, смешные недоразумения и моменты тихого удивления, постепенно превращаясь в историю доверия, человеческой чуткости и внимательного отношения к жизни.", "mood": "Тёплое, созерцательное и мягко ироничное; тревога за уязвимого героя соседствует с радостью открытия мира.", "themes": ["дружба и доверие", "способность видеть красоту", "страх смерти и любовь к жизни", "культурная память"], "visual": "Цветное изображение в формате 4:3, напоминающем исторические фотографии; спокойные композиции, естественные пейзажи и внимание к лицам, одежде и предметам быта. Свет и протяжённость дорожных сцен создают неспешный ритм.", "directors": ["Любовь Борисова"], "cast": ["Дариус Гумаускас", "Александр Чичахов", "Михаил Сажин", "Вячеслав Югов", "Елена Маркова"]}, {"id": 225011, "title": "Изгнание", "original": "Изгнание", "year": 2007, "poster": "posters/225011.jpg", "runtime": 150, "countries": ["Россия"], "genres": ["драма"], "age": "18+", "rating": 7.3, "logline": "Поездка семьи в загородный дом превращается в испытание близости, когда признание жены разрушает уверенность мужа в привычной жизни.", "synopsis": "Алекс, Вера и двое детей уезжают из города в старый семейный дом среди тихих полей. Просторный пейзаж обещает передышку, однако напряжение, накопившееся между супругами, следует за ними. Вера пытается сообщить мужу нечто, что меняет его представление об их отношениях. Алекс ищет ясное объяснение и способ действовать, но разговоры всё чаще уступают место молчанию, догадкам и советам других людей. Рядом остаются дети, родственники и знакомые, чьё присутствие подчёркивает разрыв между внешней повседневностью и внутренним кризисом семьи. Фильм разворачивается медленно, внимательно следя за паузами, жестами и расстоянием между персонажами. Его интрига строится не столько на поиске виновного, сколько на трудности услышать близкого человека, когда страх и уверенность в собственной правоте начинают определять каждое решение.", "mood": "Созерцательное, тревожное и скорбное; длительные паузы усиливают чувство надвигающейся беды.", "themes": ["отчуждение в семье", "невозможность диалога", "вина и ответственность", "вера и сомнение"], "visual": "Широкий кадр, длинные планы, приглушённая палитра и тщательно выстроенные сельские пространства; лица и фигуры часто разделены архитектурой и пустотой.", "directors": ["Андрей Звягинцев"], "cast": ["Константин Лавроненко", "Мария Бонневи", "Александр Балуев", "Дмитрий Ульянов", "Виталий Кищенко"]}, {"id": 1259195, "title": "Война искусств", "original": "War of Art", "year": 2019, "poster": "posters/1259195.jpg", "runtime": 102, "countries": ["Норвегия", "Германия"], "genres": ["документальный", "искусство"], "age": "18+", "rating": 7.4, "logline": "Художники приезжают в Северную Корею ради культурного обмена и сталкиваются с несовпадающими представлениями об искусстве и свободе.", "synopsis": "Группа международных художников отправляется в Пхеньян по инициативе Мортена Тровика. Участники рассчитывают познакомиться с северокорейскими коллегами, обменяться опытом и создать пространство для совместной работы. Но уже первые встречи обнаруживают, насколько по-разному стороны понимают назначение искусства, роль автора и допустимые способы выражения. Разговоры о красоте, технике и личном опыте постоянно затрагивают вопросы идеологии, доверия и культурных границ. Камера следует за гостями во время поездки, фиксируя профессиональное любопытство, неловкость, споры и попытки найти общий язык. Вместо готовой истории о взаимопонимании возникает наблюдение за самим процессом контакта. Каждый участник приносит собственные ожидания и привычные оценки, которые встреча заставляет проверять. Фильм предлагает смотреть на культурный обмен как на трудную практику, где искренний интерес соседствует с ограничениями, недоразумениями и неравенством возможностей.", "mood": "Любопытное, ироничное и напряжённое; комизм недоразумений соседствует с дискомфортом.", "themes": ["свобода искусства", "культурный обмен", "идеология", "границы взаимопонимания"], "visual": "Документальное наблюдение за встречами и разговорами, контраст официальных пространств с рабочими ситуациями; визуальный материал показывает условия контакта, а не только произведения искусства.", "directors": ["Томми Гулликсен"], "cast": ["Мортен Тровик", "Хенрик Плахт", "Ник Новак", "Кэти Бойд", "Квентин Ши"]}, {"id": 1347315, "title":
